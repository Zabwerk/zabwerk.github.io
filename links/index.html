  // 幂等：同一 flink 容器只绑定一次
  if (window.__flinkFlipMounted) return
  window.__flinkFlipMounted = true

  function playFlip (el, fromRect, toRect, onEnd) {
    const dx = fromRect.left - toRect.left
    const dy = fromRect.top - toRect.top
    const sx = fromRect.width / toRect.width
    const sy = fromRect.height / toRect.height
    el.style.transition = 'none'
    el.style.transformOrigin = '0 0'
    el.style.transform = `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`
    el.style.willChange = 'transform'
    // force reflow
    // eslint-disable-next-line no-unused-expressions
    el.offsetHeight
    requestAnimationFrame(() => {
      el.style.transition = 'transform .55s cubic-bezier(.22,1,.36,1)'
      el.style.transform = ''
      const done = () => {
        el.removeEventListener('transitionend', done)
        el.style.willChange = ''
        onEnd && onEnd()
      }
      el.addEventListener('transitionend', done, { once: true })
      // 保险兜底
      setTimeout(done, 700)
    })
  }

  function mount (flinkEl) {
    if (state.has(flinkEl)) return
    const st = { activeItem: null, activeAvatarEl: null, inFlight: null }
    state.set(flinkEl, st)

    // 点击列表里的某个头像项，或点击展示板内的头像（收起）
    flinkEl.addEventListener('click', (e) => {
      window.__flinkDebug = window.__flinkDebug || []
      window.__flinkDebug.push('HANDLER_FIRED: target=' + e.target.tagName + '.' + (e.target.className || '').substring(0,30))
      // 1) 点击展示板内的头像 → 收起当前激活项
      if (e.target.closest('.flink-display-avatar')) {
        window.__flinkDebug.push('DISPLAY_AVATAR_CLICK: activeItem=' + !!st.activeItem + ' inFlight=' + st.inFlight)
        if (st.activeItem && !st.inFlight) {
          e.preventDefault()
          handleSelect(flinkEl, st, st.activeItem)
        }
        return
      }
      // 2) 点击列表里的某个头像项 → 激活/切换
      const item = e.target.closest('.flink-list-item')
      if (!item || !flinkEl.contains(item)) return
      e.preventDefault()
      handleSelect(flinkEl, st, item)
    })
  }

  function handleSelect (flinkEl, st, item) {
    window.__flinkDebug = window.__flinkDebug || []
    window.__flinkDebug.push('HANDLE_SELECT: inFlight=' + st.inFlight + ' activeItem===' + (st.activeItem === item))
    if (st.inFlight) return
    const display = flinkEl.querySelector('.flink-display')
    const displayAvatarSlot = display.querySelector('.flink-display-avatar')
    const displayName = display.querySelector('.flink-display-name')
    const displayDesc = display.querySelector('.flink-display-desc')
    const displayEmpty = display.querySelector('.flink-display-empty')

    // 1) 如果点击的是当前已激活的那一个 → 收起（空状态）

    if (st.activeItem === item) {

      const originSlot = st.activeItem.querySelector('.flink-item-avatar')

        const imgRect = activeImg.getBoundingClientRect()

        const afterRect = activeImg.getBoundingClientRect()

          displayName.textContent = ''
          displayName.removeAttribute('href')
          displayDesc.textContent = ''
          display.classList.remove('is-active')
          displayEmpty && displayEmpty.classList.remove('is-hidden')
          st.activeItem = null
          st.inFlight = null
        })
      } else {
        st.inFlight = null
      }
      return
    }

    // 后续逻辑需要从 item 内找头像（未激活项的头像仍在列表中）
    const avatar = item.querySelector('.flink-avatar-img')
    if (!avatar) return

    const switchAfter = () => doActivate()
    if (st.activeItem) {
      st.inFlight = 'switch'
      const activeImg = displayAvatarSlot.querySelector('.flink-avatar-img')
      const prevOrigin = st.activeItem.querySelector('.flink-item-avatar')
      if (activeImg && prevOrigin) {
        const beforeRect = activeImg.getBoundingClientRect()
        prevOrigin.appendChild(activeImg)
        const afterRect = activeImg.getBoundingClientRect()
        playFlip(activeImg, beforeRect, afterRect, () => {
          st.activeItem = null
          st.inFlight = null
          switchAfter()
        })
        return
      } else {
        displayAvatarSlot.innerHTML = ''
        st.activeItem = null
      }
    }

    doActivate()

    function doActivate () {
      st.inFlight = 'expand'
      st.activeItem = item // 立即设置，以便动画期间也能收起
      const rectBefore = avatar.getBoundingClientRect()
      displayAvatarSlot.appendChild(avatar) // DOM 真实搬迁到展示板
      const rectAfter = avatar.getBoundingClientRect()

      // 填充右侧元信息
      displayName.textContent = item.dataset.name || ''
      displayName.href = item.dataset.link || 'javascript:void(0)'
      displayDesc.textContent = item.dataset.descr || ''
      displayEmpty && displayEmpty.classList.add('is-hidden')
      display.classList.add('is-active')

      playFlip(avatar, rectBefore, rectAfter, () => {

          displayName.removeAttribute('href')
          displayDesc.textContent = ''
          display.classList.remove('is-active')
          displayEmpty && displayEmpty.classList.remove('is-hidden')
          st.activeItem = null
          st.inFlight = null
