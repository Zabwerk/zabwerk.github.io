<script>
(function () {
  // ===== 字母 <-> 数字 转换（A=0, B=1, ..., Z=25；26 进制） =====
  function lettersToNum(s) {
    if (!s) return 0;
    let neg = false;
    if (s[0] === '-') { neg = true; s = s.slice(1); }
    let n = 0;
    for (const ch of s) {
      const code = ch.charCodeAt(0) - 65;
      if (code < 0 || code > 25) throw new Error('非法字符: ' + ch);
      n = n * 26 + code;
    }
    return neg ? -n : n;
  }
  function numToLetters(n) {
    if (n === 0) return 'A';
    const neg = n < 0;
    let abs = Math.abs(n);
    let s = '';
    while (abs > 0) {
      s = String.fromCharCode(65 + (abs % 26)) + s;
      abs = Math.floor(abs / 26);
    }
    return neg ? '-' + s : s;
  }

  // ===== 表达式求值（Shunting Yard，支持 + - * / 及优先级） =====
  function evalExpr(tokens) {
    const prec = { '+': 1, '-': 1, '*': 2, '/': 2 };
    const output = [];
    const ops = [];
    for (const tk of tokens) {
      if (tk.t === 'num') {
        output.push({ type: 'num', v: lettersToNum(tk.v) });
      } else {
        while (ops.length && prec[ops[ops.length - 1]] >= prec[tk.v]) {
          output.push({ type: 'op', v: ops.pop() });
        }
        ops.push(tk.v);
      }
    }
    while (ops.length) output.push({ type: 'op', v: ops.pop() });

    const st = [];
    for (const x of output) {
      if (x.type === 'num') {
        st.push(x.v);
      } else {
        if (st.length < 2) throw new Error('表达式不完整');
        const b = st.pop(), a = st.pop();
        let r;
        if (x.v === '+') r = a + b;
        else if (x.v === '-') r = a - b;
        else if (x.v === '*') r = a * b;
        else if (x.v === '/') {
          if (b === 0) throw new Error('除数不能为 0');
          if (a % b !== 0) throw new Error('不能整除: ' + a + ' ÷ ' + b);
          r = Math.trunc(a / b);
        }
        st.push(r);
      }
    }
    if (st.length !== 1) throw new Error('表达式不完整');
    return st[0];
  }

  // ===== 状态 =====
  const state = {
    tokens: [],      // [{t:'num',v:'BA'},{t:'op',v:'+'}]
    current: '',     // 当前正在输入的字母串
    result: null,    // 上次计算结果（字符串，如 'BB' / '-BA'）
    resultExpr: '',  // 计算完成时的表达式串 "X + Y ="
    resultTokens: [],// 计算完成时的表达式快照（供十进制对照使用）
    error: ''
  };

  const elExpr = document.getElementById('lc-expr');
  const elCurrent = document.getElementById('lc-current');
  const elError = document.getElementById('lc-error');
  const elDecHead = document.getElementById('lc-dec-head');
  const elDecBody = document.getElementById('lc-dec-body');
  const elDecList = document.getElementById('lc-dec-list');

  function opSymbol(op) {
    return op === '*' ? '×' : op === '/' ? '÷' : op === '-' ? '−' : op;
  }

  function render() {
    if (state.result !== null) {
      elExpr.textContent = state.resultExpr;
      elCurrent.textContent = state.result;
    } else {
      let exprStr = '';
      for (const tk of state.tokens) {
        if (tk.t === 'num') exprStr += tk.v;
        else exprStr += ' ' + opSymbol(tk.v) + ' ';
      }
      elExpr.textContent = exprStr;
      elCurrent.textContent = state.current || (state.tokens.length ? '' : 'A');
    }
    elError.textContent = state.error;
    renderDecimal();
  }

  // ===== 十进制对照（与主计算逻辑实时同步） =====
  function renderDecimal() {
    const rows = [];
    const tokens = state.result !== null ? state.resultTokens : state.tokens;
    for (const tk of tokens) {
      if (tk.t === 'num') {
        rows.push(['表达式', tk.v, lettersToNum(tk.v)]);
      }
    }
    if (state.result === null && state.current) {
      rows.push(['当前输入', state.current, lettersToNum(state.current)]);
    }
    if (state.result !== null) {
      rows.push(['结果', state.result, lettersToNum(state.result)]);
    }

    elDecList.innerHTML = '';
    if (!rows.length) {
      const empty = document.createElement('p');
      empty.className = 'lc-dec-empty';
      empty.textContent = '输入字母数字后显示十进制对照。';
      elDecList.appendChild(empty);
      return;
    }

    for (const [label, letters, num] of rows) {
      const row = document.createElement('div');
      row.className = 'lc-dec-row';

      const elLabel = document.createElement('span');
      elLabel.className = 'lc-dec-label';
      elLabel.textContent = label;

      const elLetters = document.createElement('span');
      elLetters.className = 'lc-dec-lets';
      elLetters.textContent = letters;

      const elNum = document.createElement('span');
      elNum.className = 'lc-dec-num';
      elNum.textContent = String(num);

      row.appendChild(elLabel);
      row.appendChild(elLetters);
      row.appendChild(elNum);
      elDecList.appendChild(row);
    }
  }

  elDecHead.addEventListener('click', function () {
    const willOpen = elDecBody.hidden;
    elDecBody.hidden = !willOpen;
    elDecHead.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    elDecHead.querySelector('.lc-dec-arrow').textContent = willOpen ? '−' : '＋';
  });

  // ===== 按键处理 =====
  function handleKey(k) {
    state.error = '';

    if (k === 'clear') {
      state.tokens = [];
      state.current = '';
      state.result = null;
      state.resultExpr = '';
      state.resultTokens = [];
      render();
      return;
    }

    if (k === 'back') {
      if (state.result !== null) {
        state.result = null;
        state.resultExpr = '';
        state.resultTokens = [];
      } else if (state.current) {
        state.current = state.current.slice(0, -1);
      } else if (state.tokens.length) {
        const last = state.tokens.pop();
        if (last.t === 'num') state.current = last.v;
      }
      render();
      return;
    }

    if (k === '=') {
      if (state.current) {
        state.tokens.push({ t: 'num', v: state.current });
        state.current = '';
      }
      // 末尾若是运算符，去掉
      if (state.tokens.length && state.tokens[state.tokens.length - 1].t === 'op') {
        state.tokens.pop();
      }
      if (state.tokens.length === 0) {
        state.error = '请输入表达式';
        render();
        return;
      }
      try {
        const r = evalExpr(state.tokens);
        let exprStr = '';
        for (const tk of state.tokens) {
          if (tk.t === 'num') exprStr += tk.v;
          else exprStr += ' ' + opSymbol(tk.v) + ' ';
        }
        state.resultExpr = exprStr + ' =';
        state.resultTokens = state.tokens.slice();
        state.result = numToLetters(r);
        state.tokens = [];
        state.current = '';
      } catch (e) {
        state.error = e.message;
      }
      render();
      return;
    }

    // 字母输入
    if (/^[A-Z]$/.test(k)) {
      if (state.result !== null) {
        // 计算后开始新表达式
        state.tokens = [];
        state.current = '';
        state.result = null;
        state.resultExpr = '';
        state.resultTokens = [];
      }
      state.current += k;
      render();
      return;
    }

    // 运算符
    if ('+-*/'.includes(k)) {
      if (state.result !== null) {
        // 用上次结果继续运算
        state.tokens = [{ t: 'num', v: state.result }];
        state.current = '';
        state.result = null;
        state.resultExpr = '';
        state.resultTokens = [];
      }
      if (state.current) {
        state.tokens.push({ t: 'num', v: state.current });
        state.current = '';
      } else if (state.tokens.length === 0) {
        state.error = '请先输入数字';
        render();
        return;
      } else if (state.tokens[state.tokens.length - 1].t === 'op') {
        // 替换上一个运算符
        state.tokens.pop();
      }
      state.tokens.push({ t: 'op', v: k });
      render();
      return;
    }
  }

  // 绑定按键
  document.querySelectorAll('.lc-key').forEach(function (btn) {
    btn.addEventListener('click', function () { handleKey(btn.dataset.k); });
  });

  // 键盘支持
  document.addEventListener('keydown', function (e) {
    if (!document.querySelector('.letter-calc')) return;
    const active = document.activeElement;
    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
    const key = e.key;
    if (/^[a-zA-Z]$/.test(key)) {
      handleKey(key.toUpperCase());
    } else if ('+-*/'.includes(key)) {
      handleKey(key);
    } else if (key === 'Enter' || key === '=') {
      e.preventDefault();
      handleKey('=');
    } else if (key === 'Backspace') {
      e.preventDefault();
      handleKey('back');
    } else if (key === 'Escape') {
      handleKey('clear');
    }
  });

  render();
})();
</script>
